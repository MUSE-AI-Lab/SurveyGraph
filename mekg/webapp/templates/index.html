<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEKG 科研情报指挥中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-cpu-fill me-2"></i>MEKG <span class="text-secondary small">指挥中心</span>
            </a>
            <div class="d-flex align-items-center">
                <div class="me-4 text-end">
                    <div class="text-muted small">系统状态</div>
                    <span id="connection-status" class="badge bg-danger">未连接</span>
                </div>
                <div class="text-end">
                    <div class="text-muted small">爬虫引擎</div>
                    <span id="crawler-status" class="badge bg-secondary">未知</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row g-4">
            <!-- 左侧：控制与日志 -->
            <div class="col-md-3">
                <!-- 控制面板 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="bi bi-sliders me-2"></i>任务控制
                    </div>
                    <div class="card-body">
                        <!-- 智能 Topic 发掘 -->
                        <div class="mb-4">
                            <label class="form-label text-info small mb-2">智能 Topic 发掘</label>
                            <div class="input-group mb-2">
                                <input type="text" id="topic-input" class="form-control bg-dark text-light border-secondary" placeholder="输入 Topic (如 LLM Agents)">
                                <button class="btn btn-outline-info" type="button" onclick="fetchSubgraph()">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                            <div class="form-text text-muted small">输入 Topic，系统将自动判断是否需要爬取并构建图谱。</div>
                        </div>

                        <hr class="border-secondary my-3">

                        <div class="d-grid gap-3">
                            <button id="btn-start" class="btn btn-cyber" onclick="startCrawler()">
                                <i class="bi bi-play-fill me-2"></i>启动全自动爬取 (批量)
                            </button>
                            <button id="btn-stop" class="btn btn-cyber btn-cyber-danger" onclick="stopCrawler()" disabled>
                                <i class="bi bi-stop-fill me-2"></i>紧急停止
                            </button>
                        </div>
                        
                        <hr class="border-secondary my-4">
                        
                        <div class="row text-center">
                            <div class="col-6 border-end border-secondary">
                                <div id="stat-papers" class="stat-value">0</div>
                                <div class="stat-label">已收录论文</div>
                            </div>
                            <div class="col-6">
                                <div id="stat-communities" class="stat-value" style="color: #a855f7;">0</div>
                                <div class="stat-label">发现社区</div>
                            </div>
                        </div>
                        
                        <hr class="border-secondary my-4">
                        
                        <div>
                            <label class="stat-label mb-2"><i class="bi bi-activity me-2"></i>当前任务</label>
                            <div id="current-task" class="text-info font-monospace small">系统待机中...</div>
                        </div>
                    </div>
                </div>

                <!-- 实时日志 -->
                <div class="card h-100" style="min-height: 400px;">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-terminal-fill me-2"></i>系统日志流</span>
                        <span class="badge bg-dark border border-secondary font-monospace" id="log-count">0</span>
                    </div>
                    <div class="card-body p-0">
                        <div id="terminal" class="terminal-window">
                            <!-- Logs will appear here -->
                            <div class="text-muted fst-italic p-2">等待数据流接入...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：图谱可视化 -->
            <div class="col-md-9">
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-share-fill me-2"></i>全域知识图谱</span>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-secondary" onclick="refreshGraph()">
                                <i class="bi bi-arrow-clockwise me-1"></i>刷新视图
                            </button>
                            <span class="badge bg-dark border border-secondary d-flex align-items-center" id="graph-stats">
                                节点: 0 | 关系: 0
                            </span>
                        </div>
                    </div>
                    <div class="card-body p-0 position-relative bg-black">
                        <div id="mynetwork" style="width: 100%; height: 80vh;"></div>
                        
                        <!-- 节点详情浮层 -->
                        <div id="node-details" class="node-details-panel d-none">
                            <div class="detail-header d-flex justify-content-between align-items-start">
                                <h5 class="card-title mb-0 text-info" id="detail-title" style="font-size: 1rem; line-height: 1.4;">Title</h5>
                                <button type="button" class="btn-close btn-close-white ms-2" onclick="closeDetails()"></button>
                            </div>
                            <div class="card-text small" id="detail-content"></div>
                        </div>
                        
                        <!-- 加载动画 -->
                        <div id="graph-loading" class="position-absolute top-50 start-50 translate-middle d-none">
                            <div class="spinner-border text-info" role="status"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
