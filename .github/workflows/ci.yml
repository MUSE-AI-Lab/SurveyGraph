name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  public-release:
    name: Public release checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python sources
        run: python -m compileall -q src mekg evaluation experiments tests frontend scripts
      - name: Run public-release tests
        run: python -m pytest -q tests/test_public_release.py tests/test_run_sg_endtoend.py tests/test_runner_cli.py
      - name: Scan tracked release files
        run: python scripts/check_public_release.py
      - name: Build public release tree
        run: python scripts/stage_public_release.py --output release_artifacts/public_release
      - name: Scan public release tree
        run: python scripts/check_public_release.py --root release_artifacts/public_release
      - name: Package public release
        run: python scripts/package_public_release.py --source release_artifacts/public_release --output release_artifacts/SurveyGraph-public-release.zip
