{% extends "base.html" %}

{% block title %}我的任务 - SurveyGraph{% endblock %}

{% block head %}
<!-- ECharts 已在 base.html 中加载，无需重复加载 -->
<style>
    /* 管理员视图切换开关样式 */
    .admin-view-toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: var(--bg-secondary);
        border-radius: 8px;
        margin-left: 16px;
    }
    .admin-view-toggle label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: 14px;
        color: var(--text-secondary);
    }
    .admin-view-toggle input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
    }
    .admin-view-toggle .toggle-icon {
        color: var(--accent-primary);
    }
    /* 任务所有者标签 */
    .task-owner-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        background: var(--accent-primary-light, rgba(99, 102, 241, 0.1));
        color: var(--accent-primary);
        border-radius: 4px;
        font-size: 12px;
        margin-left: 8px;
    }
    .task-owner-badge i {
        font-size: 10px;
    }
    /* 搜索框样式 */
    .search-input-wrapper {
        position: relative;
        margin-right: 12px;
    }
    .search-input-wrapper input {
        padding-left: 36px;
        width: 200px;
    }
    .search-input-wrapper i {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
    }
</style>
{% endblock %}

{% block content %}
<div class="dashboard">
    <div class="dashboard-header">
        <div class="dashboard-title">
            <h1 id="dashboard-title">我的任务</h1>
            <p class="dashboard-subtitle" id="dashboard-subtitle">管理和监控您的综述生成任务</p>
        </div>
        <div style="display: flex; align-items: center;">
            <!-- 管理员视图切换（仅管理员可见） -->
            <div id="admin-view-toggle" class="admin-view-toggle" style="display: none;">
                <label>
                    <input type="checkbox" id="view-all-tasks" onchange="toggleAdminView()">
                    <i class="fas fa-users-cog toggle-icon"></i>
                    <span>查看所有用户任务</span>
                </label>
            </div>
            <a href="/task/new" class="btn btn-primary">
                <i class="fas fa-plus"></i> 创建综述
            </a>
        </div>
    </div>
    

    <!-- 统计卡片 -->
    <div class="dashboard-stats" id="stats-container">
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-file-alt"></i>
            </div>
            <div class="stat-info">
                <div class="stat-value" id="stat-total">-</div>
                <div class="stat-label">总任务数</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <div class="stat-info">
                <div class="stat-value" id="stat-completed">-</div>
                <div class="stat-label">已完成</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-spinner"></i>
            </div>
            <div class="stat-info">
                <div class="stat-value" id="stat-running">-</div>
                <div class="stat-label">进行中</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon">
                <i class="fas fa-coins"></i>
            </div>
            <div class="stat-info">
                <div class="stat-value" id="stat-quota">-</div>
                <div class="stat-label">剩余配额</div>
            </div>
        </div>
    </div>
    
    <!-- 任务列表 -->
    <div class="dashboard-content">
        <div class="content-header">
            <h2 class="content-title" id="task-list-title">任务列表</h2>
            <div class="task-filters" style="display: flex; align-items: center;">
                <!-- 搜索框（管理员视图时显示） -->
                <div id="search-wrapper" class="search-input-wrapper" style="display: none;">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" class="form-input" placeholder="搜索主题..." onkeyup="handleSearchKeyup(event)">
                </div>
                <select id="status-filter" class="form-select">
                    <option value="">全部状态</option>
                    <option value="pending">等待中</option>
                    <option value="running">运行中</option>
                    <option value="completed">已完成</option>
                    <option value="failed">失败</option>
                    <option value="cancelled">已取消</option>
                </select>
            </div>
        </div>
        
        <div id="task-list" class="task-list">
            <div class="loading-placeholder" style="text-align: center; padding: 60px;">
                <div class="spinner"></div>
                <p style="margin-top: 16px; color: var(--text-muted);">加载任务列表...</p>
            </div>
        </div>
        
        <div id="pagination" class="pagination-container"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 全局状态
let isAdminViewAll = false;
let currentUserIsAdmin = false;
let searchTimeout = null;

document.addEventListener('DOMContentLoaded', async () => {
    // 检查用户是否是管理员
    try {
        const user = await api.getCurrentUser();
        
        // 调试信息
        const debugEl = document.getElementById('debug-info');
        if (debugEl) {
            debugEl.style.display = 'block';
            debugEl.textContent = `Debug: User Role=${user.role}, IsAdmin=${user.is_admin}, Username=${user.username}`;
        }

        currentUserIsAdmin = user.is_admin;
        const toggleEl = document.getElementById('admin-view-toggle');
        
        if (currentUserIsAdmin) {
            if (toggleEl) {
                toggleEl.style.display = 'flex';
            }
        }
    } catch (e) {
        console.error('Failed to get user info:', e);
    }
    
    await loadDashboardData();
    document.getElementById('status-filter').addEventListener('change', () => loadTaskList(1));
});

// 切换管理员视图
function toggleAdminView() {
    isAdminViewAll = document.getElementById('view-all-tasks').checked;
    
    // 更新标题
    const title = document.getElementById('dashboard-title');
    const subtitle = document.getElementById('dashboard-subtitle');
    const listTitle = document.getElementById('task-list-title');
    const searchWrapper = document.getElementById('search-wrapper');
    
    if (isAdminViewAll) {
        if (title) title.textContent = '所有任务';
        if (subtitle) subtitle.textContent = '管理员视图 - 查看和管理所有用户的任务';
        if (listTitle) listTitle.textContent = '全部任务列表';
        if (searchWrapper) searchWrapper.style.display = 'block';
    } else {
        if (title) title.textContent = '我的任务';
        if (subtitle) subtitle.textContent = '管理和监控您的综述生成任务';
        if (listTitle) listTitle.textContent = '任务列表';
        if (searchWrapper) {
            searchWrapper.style.display = 'none';
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.value = '';
        }
    }
    
    // 重新加载任务列表
    loadTaskList(1);
}

// 搜索输入处理（防抖）
function handleSearchKeyup(event) {
    if (searchTimeout) {
        clearTimeout(searchTimeout);
    }
    searchTimeout = setTimeout(() => {
        loadTaskList(1);
    }, 300);
}

async function loadDashboardData() {
    try {
        const [stats, quota] = await Promise.all([
            api.getUserStats(),
            api.getQuota()
        ]);
        
        document.getElementById('stat-total').textContent = stats.total_tasks || 0;
        document.getElementById('stat-completed').textContent = stats.completed_tasks || 0;
        document.getElementById('stat-running').textContent = stats.running_tasks || 0;
        document.getElementById('stat-quota').textContent = `${quota.remaining_today}/${quota.daily_quota} + ${quota.bonus_quota}`;
        
        await loadTaskList(1);
    } catch (e) {
        Toast.error('加载数据失败: ' + e.message);
    }
}

async function loadTaskList(page = 1) {
    const container = document.getElementById('task-list');
    const status = document.getElementById('status-filter').value;
    const search = isAdminViewAll ? document.getElementById('search-input').value.trim() : null;
    
    try {
        const result = await api.getTasks(page, 10, status || null, isAdminViewAll, search || null);
        const tasks = result.tasks || result.items || [];
        const isAdminView = result.is_admin_view;
        
        if (tasks.length === 0) {
            const emptyMessage = isAdminViewAll
                ? '没有找到匹配的任务'
                : '点击"创建综述"开始您的第一个任务';
            container.innerHTML = `
                <div class="empty-state" style="text-align: center; padding: 60px;">
                    <i class="fas fa-file-alt" style="font-size: 64px; color: var(--text-light); margin-bottom: 24px;"></i>
                    <h3>暂无任务</h3>
                    <p style="color: var(--text-muted); margin-bottom: 24px;">${emptyMessage}</p>
                    ${!isAdminViewAll ? `
                    <a href="/task/new" class="btn btn-primary">
                        <i class="fas fa-plus"></i> 创建综述
                    </a>
                    ` : ''}
                </div>
            `;
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        
        container.innerHTML = tasks.map(task => `
            <div class="task-card ${task.status}" onclick="window.location.href='/task/${task.task_id}'">
                <!-- 悬停操作按钮 -->
                <div class="task-card-actions">
                    <button class="task-card-action-btn" onclick="event.stopPropagation(); viewTaskDetail('${task.task_id}')" title="查看详情">
                        <i class="fas fa-eye"></i>
                    </button>
                    ${task.status === 'completed' ? `
                    <button class="task-card-action-btn" onclick="event.stopPropagation(); downloadTask('${task.task_id}')" title="下载">
                        <i class="fas fa-download"></i>
                    </button>
                    ` : ''}
                    ${task.status === 'running' ? `
                    <button class="task-card-action-btn" onclick="event.stopPropagation(); pauseTask('${task.task_id}')" title="暂停">
                        <i class="fas fa-pause"></i>
                    </button>
                    ` : ''}
                    ${task.status === 'pending' ? `
                    <button class="task-card-action-btn" onclick="event.stopPropagation(); startTask('${task.task_id}')" title="启动">
                        <i class="fas fa-play"></i>
                    </button>
                    ` : ''}
                    ${task.status === 'paused' ? `
                    <button class="task-card-action-btn" onclick="event.stopPropagation(); startTask('${task.task_id}')" title="继续">
                        <i class="fas fa-play"></i>
                    </button>
                    ` : ''}
                    ${(task.status === 'running' || task.status === 'pending' || task.status === 'paused') ? `
                    <button class="task-card-action-btn" onclick="event.stopPropagation(); cancelTask('${task.task_id}')" title="取消">
                        <i class="fas fa-times"></i>
                    </button>
                    ` : ''}
                    ${currentUserIsAdmin ? `
                    <button class="task-card-action-btn" onclick="event.stopPropagation(); forceRetryTask('${task.task_id}')" title="从头开始(Admin)">
                        <i class="fas fa-redo"></i>
                    </button>
                    ` : ''}
                </div>
                
                <!-- 卡片头部 -->
                <div class="task-card-header">
                    <div class="task-card-info">
                        <h3 class="task-card-title">
                            ${escapeHtml(task.topic)}
                            ${isAdminView && task.owner_username ? `
                            <span class="task-owner-badge">
                                <i class="fas fa-user"></i>
                                ${escapeHtml(task.owner_username)}
                            </span>
                            ` : ''}
                        </h3>
                        <div class="task-card-topic">
                            <span class="task-card-topic-text">
                                ${task.current_step_name ? getStepName(task.current_step_name) : getStepName(task.current_step) || '等待开始'}
                            </span>
                        </div>
                    </div>
                    ${renderTaskStatusBadge(task.status)}
                </div>
                
                <!-- 进度条（运行中显示） -->
                ${task.status === 'running' ? `
                <div class="task-card-progress">
                    <div class="task-card-progress-header">
                        <span class="task-card-progress-label">任务进度</span>
                        <span class="task-card-progress-value">${task.progress_percent || 0}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-bar-fill" style="width: ${task.progress_percent || 0}%"></div>
                    </div>
                </div>
                ` : ''}
                
                <!-- 卡片底部 -->
                <div class="task-card-footer">
                    <div class="task-card-footer-item">
                        <i class="fas fa-clock"></i>
                        <span>${formatRelativeTime(task.created_at)}</span>
                    </div>
                    ${task.papers_count ? `
                    <div class="task-card-footer-item">
                        <i class="fas fa-file-pdf"></i>
                        <span>${task.papers_count} 篇论文</span>
                    </div>
                    ` : ''}
                    ${task.status === 'completed' && task.completed_at ? `
                    <div class="task-card-footer-item">
                        <i class="fas fa-check-circle"></i>
                        <span>完成于 ${formatRelativeTime(task.completed_at)}</span>
                    </div>
                    ` : ''}
                </div>
            </div>
        `).join('');
        
        // 分页
        if (result.total > result.page_size) {
            new Pagination(document.getElementById('pagination'), {
                total: result.total,
                pageSize: result.page_size,
                currentPage: result.page,
                onChange: loadTaskList
            });
        } else {
            document.getElementById('pagination').innerHTML = '';
        }
    } catch (e) {
        container.innerHTML = `
            <div class="error-state" style="text-align: center; padding: 60px; color: var(--accent-error);">
                <i class="fas fa-exclamation-circle" style="font-size: 48px; margin-bottom: 16px;"></i>
                <p>加载失败，请刷新重试</p>
            </div>
        `;
    }
}

function renderTaskStatusBadge(status) {
    const statusMap = {
        pending: { label: '等待中', class: 'pending', icon: 'fa-clock' },
        running: { label: '运行中', class: 'running', icon: 'fa-spinner fa-spin' },
        completed: { label: '已完成', class: 'completed', icon: 'fa-check' },
        failed: { label: '失败', class: 'failed', icon: 'fa-times' },
        paused: { label: '已暂停', class: 'paused', icon: 'fa-pause' },
        cancelled: { label: '已取消', class: 'pending', icon: 'fa-ban' }
    };
    
    const info = statusMap[status] || { label: status, class: 'pending', icon: 'fa-question' };
    return `<span class="task-card-status ${info.class}"><i class="fas ${info.icon}"></i> ${info.label}</span>`;
}

// 任务操作函数
function viewTaskDetail(taskId) {
    window.location.href = `/task/${taskId}`;
}

function downloadTask(taskId) {
    window.open(`/api/tasks/${taskId}/download`, '_blank');
}

async function startTask(taskId) {
    try {
        await api.startTask(taskId);
        Toast.success('任务已启动');
        loadTaskList(1);
    } catch (e) {
        Toast.error('启动失败: ' + e.message);
    }
}

async function pauseTask(taskId) {
    try {
        await api.pauseTask(taskId);
        Toast.success('任务已暂停');
        loadTaskList(1);
    } catch (e) {
        Toast.error('暂停失败: ' + e.message);
    }
}

async function cancelTask(taskId) {
    if (!confirm('确定要取消此任务吗？')) {
        return;
    }
    try {
        await api.cancelTask(taskId);
        Toast.success('任务已取消');
        loadTaskList(1);
    } catch (e) {
        Toast.error('取消失败: ' + e.message);
    }
}

async function forceRetryTask(taskId) {
    if (!confirm('确定要强制从头开始此任务吗？这将清除当前进度。')) {
        return;
    }
    try {
        await api.adminForceRetryTask(taskId, 0);
        Toast.success('任务已强制从头开始');
        loadTaskList(1);
    } catch (e) {
        Toast.error('操作失败: ' + e.message);
    }
}
</script>
{% endblock %}
